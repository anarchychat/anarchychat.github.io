# fly.toml app configuration file generated for anarchychat-app on 2026-10-26T23:32:38Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'anarchychat-app'
primary_region = 'ams'
swap_size_mb = 256

[build]

[[services]]
  internal_port = 3000
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = "80"

  [[services.ports]]
    handlers = ["tls", "http"]
    port = "443"

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 256

# fly.toml app configuration file generated for anarchychat-app on 2026-10-26T23:32:38Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'anarchychat-app'
primary_region = 'ams'
swap_size_mb = 256

[build]

[http_service]
  internal_port = 3000
  force_https = false
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[services.ports]]
  handlers = ["http"]
  start_port = 5001
  end_port = 5005

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
